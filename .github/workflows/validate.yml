name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate skills
        run: python scripts/validate_skills.py
      - name: Test validator
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git show --format= --check HEAD

  fmt-smoke:
    needs: validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: skills/conan2-cmake/assets/fmt-demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Conan
        run: python -m pip install "conan==2.34.0"
      - name: Prepare profile and dependencies
        run: |
          conan profile detect --exist-ok
          conan profile show
          conan install . -s:h build_type=Debug -s:h compiler.cppstd=17 --build=missing
      - name: Configure and build
        run: |
          cmake --list-presets
          cmake --preset conan-debug
          cmake --build --preset conan-debug --parallel
      - name: Run fmt example
        run: test "$(./build/Debug/hello)" = "Hello, Conan! Answer = 42"
